# Continuous integration. See docs/CICD.md for what each job checks and how to read a failure.
# Action versions: the newest major tags I could verify when this was written (2026-11-24, no network check of
# the Marketplace was possible). Dependabot (.github/dependabot.yml) proposes upgrades weekly.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (python 3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dev.txt
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Third-party imports match requirements.txt
        run: python scripts/scan_imports.py
      - name: Byte-compile the source folders
        run: python -m compileall -q *.py ai routes services utils scripts tests migrations
      - name: Pytest (tests/conftest.py sets its own temp DB and env, no secrets, no Gemini)
        run: pytest tests -q -p no:cacheprovider -W ignore

  frontend:
    name: frontend (css and js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/frontend/package-lock.json
      - name: Build Tailwind CSS
        working-directory: tools/frontend
        run: |
          npm ci
          npm run build:css
      - name: Committed CSS must match the templates
        run: |
          git diff --exit-code --stat static/css/tailwind.css || {
            echo "::error::static/css/tailwind.css is out of date. Run 'cd tools/frontend && npm run build:css' and commit the result."
            exit 1
          }
      - name: Syntax-check every JS file under static/js
        run: |
          count=0
          while IFS= read -r f; do
            node --check "$f" || { echo "::error file=$f::JS syntax error"; exit 1; }
            count=$((count + 1))
          done < <(find static/js -name '*.js' -type f | sort)
          echo "checked $count files"

  docker:
    name: docker (build and smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image from the repo Dockerfile (not pushed)
        run: docker build -t mindfull-ci .
      - name: Image runs as a non-root user and holds the built asset bundles
        run: |
          test "$(docker run --rm --entrypoint id mindfull-ci -un)" = "app"
          test -n "$(docker run --rm --entrypoint ls mindfull-ci /app/static/gen)"
      - name: Start the container in production mode (runs flask db upgrade, then gunicorn)
        run: |
          key=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
          docker run -d --name mfh -p 8080:5000 \
            -e FLASK_ENV=production -e SECRET_KEY="$key" \
            -e DATABASE_URL=sqlite:////tmp/ci.db -e TRUST_PROXY=0 \
            mindfull-ci
      - name: Wait for /health (up to 90 s), then check /ready (migrations applied)
        run: |
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then ok=1; break; fi
            if [ "$(docker inspect -f '{{.State.Running}}' mfh)" != "true" ]; then break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then echo "::error::/health did not answer (or the container exited)"; exit 1; fi
          curl -fsS http://127.0.0.1:8080/health; echo
          curl -fsS http://127.0.0.1:8080/ready; echo
      - name: Container logs
        if: failure()
        run: docker logs mfh 2>&1 | tail -n 150

  e2e:
    name: e2e (real browser, not required yet)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true  # make it a gate once it has been green for a week (docs/CICD.md)
    env:
      DATABASE_URL: sqlite:////tmp/e2e.db
      BASE: http://127.0.0.1:5000
      EDGE: /usr/bin/google-chrome  # the harness reads EDGE for the browser path; ubuntu-latest ships Chrome
      SHOTS: /tmp/shots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/e2e/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt
          cd tools/e2e && npm ci
      - name: Start the demo server (seeded demo accounts) in the background
        run: |
          nohup python scripts/local_demo.py --port 5000 > /tmp/demo.log 2>&1 &
          for i in $(seq 1 45); do
            curl -fsS "$BASE/health" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "::error::demo server did not start"; tail -n 80 /tmp/demo.log; exit 1
      - name: Run the specs
        working-directory: tools/e2e
        run: |
          mkdir -p "$SHOTS"
          failed=0
          for spec in assessment_progress chat breathing clinical_smoke; do
            echo "::group::$spec"
            node "specs/$spec.mjs" || { echo "::error::spec $spec failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
      - name: Demo server log
        if: failure()
        run: tail -n 100 /tmp/demo.log

  audit:
    name: audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: pip-audit (known vulnerabilities in requirements.txt)
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt | tee -a "$GITHUB_STEP_SUMMARY"
      - name: npm audit (production dependencies of the build tool)
        continue-on-error: true
        working-directory: tools/frontend
        run: npm audit --omit=dev | tee -a "$GITHUB_STEP_SUMMARY"

  ci-ok:
    name: ci-ok
    needs: [test, frontend, docker]
    if: ${{ always() }}  # a skipped required check counts as passed, so decide explicitly
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          echo "test=${{ needs.test.result }} frontend=${{ needs.frontend.result }} docker=${{ needs.docker.result }}"
          test "${{ needs.test.result }}" = "success" -a "${{ needs.frontend.result }}" = "success" -a "${{ needs.docker.result }}" = "success"
