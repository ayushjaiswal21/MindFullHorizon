# Render Blueprint for MindFull Horizon (see docs/DEPLOY.md).
# Create it from the dashboard: New > Blueprint > pick this repo. Render asks for every `sync: false`
# value once, at creation. Later changes to those values are made in the dashboard (Environment tab),
# not here: Render ignores `sync: false` variables when the Blueprint is updated.
# Only variables the code really reads are listed (grep os.getenv / os.environ; docs/DEPLOY.md section 3).
services:
  - type: web
    name: mindfull-horizon
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free            # DEMO ONLY: sleeps after 15 min idle, which stops crisis escalation timers. Use a paid always-on plan for real students.
    # Render regions: oregon, ohio, virginia, frankfurt, singapore (no India region as of 2026-11-24).
    # Singapore is the closest to Indian users, and Neon has a matching region (aws-ap-southeast-1).
    # Put the Neon project in the SAME region as this service; cross-ocean database calls make every page slow.
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health     # constant 200, no database: a Neon cold start cannot fail the deploy
    envVars:
      # ---- fixed, non-secret values ----
      - key: FLASK_ENV
        value: production
      - key: JOBS_INPROCESS        # job worker thread inside the web process (emails, crisis escalation)
        value: "1"
      - key: ENABLE_PRESCRIPTIONS  # owner decision: on (verified doctors only; legal and pharmacist review still pending)
        value: "1"
      - key: TRUST_PROXY           # Render's proxy terminates TLS: ProxyFix for scheme, host and client IP (utils/proxy.py)
        value: "1"
      - key: LOG_TO_STDOUT         # the disk is ephemeral; Render shows stdout (utils/log_config.py)
        value: "1"
      - key: JOB_IDLE_MAX_SECONDS  # idle job worker checks the queue at most this often (a short timer would keep Neon awake)
        value: "900"
      - key: CONSENT_VERSION
        value: "2026-11"
      # ---- generated by Render on first creation (copy PROVIDER_INVITE_CODE and DOCTOR_INVITE_CODE from the dashboard to share with counsellors and doctors) ----
      - key: SECRET_KEY
        generateValue: true
      - key: PROVIDER_INVITE_CODE
        generateValue: true
      - key: DOCTOR_INVITE_CODE    # doctors need it to sign up (must differ from the counsellor code)
        generateValue: true
      # ---- you fill these in when Render asks ----
      - key: DATABASE_URL          # Neon DIRECT connection string (host without -pooler), ends with ?sslmode=require
        sync: false
      - key: SITE_URL              # https://your-name.onrender.com or your own domain, no trailing slash
        sync: false
      - key: GEMINI_API_KEY        # optional: without it the AI uses canned fallback text
        sync: false
      - key: AUDIO_BASE_URL        # optional: public bucket URL holding the binaural mp3s
        sync: false
      - key: CRISIS_ESCALATION_EMAIL   # REQUIRED for a pilot: emailed at escalation levels 2 and 3
        sync: false
      - key: CONTACT_RECIPIENT     # inbox for contact-form messages
        sync: false
      - key: GRIEVANCE_EMAIL       # shown on the privacy page
        sync: false
      - key: DATA_FIDUCIARY_NAME   # shown on the privacy page
        sync: false
      - key: SMTP_HOST             # SMTP_* are all-or-none; leave them blank to run without email
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
