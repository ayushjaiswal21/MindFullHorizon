{% extends "base.html" %}

{% block title %}Select Your Role - Mindful Horizon{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col items-center justify-center px-4 py-16">
    <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">What brings you here?</h1>

    <form action="{{ url_for('save_role') }}" method="POST" class="flex flex-col items-center gap-6">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <button type="submit" name="role" value="patient" class="bg-white rounded-lg shadow-md p-8 text-center w-72 hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <span class="block text-2xl font-bold text-gray-800">Student</span>
            <span class="block text-gray-500 mt-2">I'm here to improve my mental wellness.</span>
        </button>

        <p class="text-sm text-gray-600 max-w-sm text-center">
            Counselor accounts are created with an invite code from your institution. Use the
            <a href="{{ url_for('auth.signup') }}" class="text-indigo-600 underline">sign-up page</a> if you have one.
        </p>
    </form>
</div>
{% endblock %}
